<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Developer Tools - Code Explainer</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; }
main { max-width: 850px; margin: auto; padding: 45px 20px; }
h1 { color: #67e8f9; font-size: 36px; }
p { color: #cbd5e1; line-height: 1.7; }
textarea { width: 100%; height: 220px; padding: 18px; background: #1e293b; color: white; border: 1px solid #64748b; border-radius: 12px; font-size: 16px; }
button { margin: 12px 8px 12px 0; padding: 14px 20px; border: 0; border-radius: 10px; background: #22d3ee; color: #082f49; font-weight: bold; cursor: pointer; }
button.secondary { background: #334155; color: white; }
#result { margin-top: 18px; padding: 20px; background: #1e293b; border-radius: 12px; line-height: 1.8; white-space: pre-wrap; }
footer { margin-top: 25px; color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>AI Developer Tools</h1>
<p>Free Code Explainer</p>
<p>Paste JavaScript, HTML or CSS code to get a simple explanation of common patterns.</p>
<textarea id="code" placeholder="Paste your code here..."></textarea>
<div>
<button onclick="explainCode()">Explain My Code</button>
<button class="secondary" onclick="copyResult()">Copy Result</button>
<button class="secondary" onclick="clearCode()">Clear Code</button>
</div>
<div id="result" aria-live="polite">Your explanation will appear here.</div>
<footer>Free and open-source. Rule-based explanations. No AI model or external API is used.</footer>
</main>
<script>
function explainCode() {
  const code = document.getElementById("code").value;
  const findings = [];
  if (!code.trim()) {
    document.getElementById("result").textContent = "Please paste some code first.";
    return;
  }
  if (/\bfunction\s+\w+|=>/.test(code)) findings.push("Function: Defines reusable logic.");
  if (/\b(const|let|var)\s+/.test(code)) findings.push("Variable: Stores a value or reference.");
  if (/console\.log\s*\(/.test(code)) findings.push("Console output: Prints debugging information.");
  if (/\bif\s*\(/.test(code)) findings.push("Condition: Runs code when a condition is true.");
  if (/\b(for|while)\s*\(/.test(code)) findings.push("Loop: Repeats instructions.");
  if (/<[a-z][\s\S]*?>/i.test(code)) findings.push("HTML: Defines webpage structure.");
  if (/[.#]?[a-z][\w-]*\s*\{[^}]*:[^}]*\}/i.test(code)) findings.push("CSS: Styles webpage elements.");
  if (/\b(async|await)\b/.test(code)) findings.push("Async: Handles asynchronous operations.");
  document.getElementById("result").textContent = findings.length
    ? "Code Analysis\n\n" + findings.map((item, i) => (i + 1) + ". " + item).join("\n\n")
    : "No known patterns detected. Try JavaScript, HTML or CSS.";
}
async function copyResult() {
  const text = document.getElementById("result").textContent;
  try {
    await navigator.clipboard.writeText(text);
    alert("Result copied!");
  } catch (error) {
    alert("Copy failed. Please select and copy the result manually.");
  }
}
function clearCode() {
  document.getElementById("code").value = "";
  document.getElementById("result").textContent = "Your explanation will appear here.";
}
</script>
</body>
</html>
